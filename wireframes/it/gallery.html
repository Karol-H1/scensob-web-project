<style>
  :root, :root[data-theme="dark"], :root[data-theme="light"]{
    --bg:#FFFFFF; --surface:#FFFFFF; --ink:#33302B; --muted:#7A7168;

    --stripe: repeating-linear-gradient(135deg, rgba(122,113,104,0.08) 0 10px, transparent 10px 20px);

  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family: ui-sans-serif, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  h1{ font-family: ui-serif, Georgia, "Times New Roman", serif; text-wrap: balance; margin:0; font-weight:600; }
  a{ color:inherit; }
  .tag{ display:inline-block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line-strong); border-radius:3px; padding:2px 8px; margin-bottom:14px; font-weight:600; }
  .wrap{ max-width:1120px; margin:0 auto; padding:0 28px; }
  .band{ padding:64px 0; }
  header{ position:sticky; top:0; z-index:10; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom:1px solid var(--line); }

  .word{ display:inline-flex; flex-direction:column; align-items:flex-start; gap:2px; text-decoration:none; }
  .word svg{ height:42px; width:auto; display:block; }
  .word small{ display:block; font-family:ui-sans-serif,system-ui,sans-serif; font-size:10px; font-weight:600; letter-spacing:.12em; color:var(--muted); text-transform:uppercase; }
  nav{ display:flex; gap:26px; font-size:14px; font-weight:600; }
  nav a{ color:var(--muted); text-decoration:none; }
  nav a.current{ color:var(--ink); }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
  @media (max-width:820px){ .grid-3{ grid-template-columns:1fr 1fr; } }
  @media (max-width:560px){ .grid-3{ grid-template-columns:1fr; } }
  .ph{ background:var(--stripe); border:1px dashed var(--line-strong); border-radius:10px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; text-align:center; padding:10px; aspect-ratio: 4/3; }
  footer{ padding:40px 0 60px; border-top:1px solid var(--line); }
  .ph-img{ width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:10px; display:block; }
  .ph-img.wide{ aspect-ratio:16/6; }
  .footcols{ display:flex; justify-content:space-between; gap:40px; flex-wrap:wrap; font-size:13px; color:var(--muted); }
  .footcols .col h4{ color:var(--ink); font-size:12px; text-transform:uppercase; letter-spacing:.08em; margin:0 0 12px; }
  .footcols .col a{ display:block; color:var(--muted); text-decoration:none; margin-bottom:8px; }
</style>
